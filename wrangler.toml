# Cloudflare Pages 配置
# 直传（Direct Upload）模式下，这个文件同时负责声明 Functions 的 KV 绑定。
name = "naiwa-fart"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

# 到访计数（total）及排行榜快照（leaderboard:top:v1）；两者使用独立键。
[[kv_namespaces]]
binding = "PLAY_COUNTER"
id = "01e0d40dd26241728f478c9a55747530"

[[d1_databases]]
binding = "LEADERBOARD_DB"
database_name = "naiwa-fart-leaderboard"
database_id = "e06f0ada-4703-4eec-ada9-8570cfaeeecf"
