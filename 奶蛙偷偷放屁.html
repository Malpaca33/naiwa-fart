<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>奶蛙偷偷放屁</title>

  <!-- 添加到主屏幕后作为独立 App 运行 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="奶蛙放屁">
  <meta name="application-name" content="奶蛙放屁">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #0b1329;
      font-family: "Lantinghei SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    #game-container {
      position: relative;
      width: 100vw;
      max-width: 500px;
      height: 100vh;
      max-height: 860px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      border-radius: 20px;
      overflow: hidden;
    }

    /* Top HUD */
    .hud-header {
      padding: 12px 16px 8px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid rgba(226, 232, 240, 0.9);
      z-index: 10;
    }

    /* Large Soundwave Visualizer Box (放大，其他都不要) */
    .soundwave-box {
      width: 100%;
      height: 52px;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      padding: 0 14px;
      margin-bottom: 10px;
      transition: all 0.25s ease;
      overflow: hidden;
    }
    .soundwave-box.safe {
      background: #ecfdf5;
      border-color: #10b981;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.35);
    }
    .soundwave-box.danger {
      background: #f8fafc;
      border-color: #e2e8f0;
    }
    .wave-bar {
      flex: 1;
      max-width: 12px;
      height: 6px;
      border-radius: 6px;
      background: #cbd5e1;
      transition: height 0.08s ease, background-color 0.15s ease;
    }

    /* 5-Segment Grid Status Bars (五格子带颜色 + 警示察觉程度) */
    .bars-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat-card {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 7px 10px;
    }
    /* 状态区只用大图标 / 大字表达，不放小字说明 */
    .stat-label-row {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 26px;
      margin-bottom: 7px;
    }
    .stat-status-badge {
      font-size: 17px;
      font-weight: 900;
      line-height: 1.2;
      padding: 3px 12px;
      border-radius: 9px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* 5-Block Grid Container */
    .grid-blocks-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      height: 12px;
    }
    .grid-block {
      height: 100%;
      border-radius: 3px;
      background: #e2e8f0;
      transition: all 0.12s ease;
    }
    .grid-block.active.tier-1 { background: #22c55e; box-shadow: 0 0 4px rgba(34, 197, 94, 0.4); }
    .grid-block.active.tier-2 { background: #84cc16; box-shadow: 0 0 4px rgba(132, 204, 22, 0.4); }
    .grid-block.active.tier-3 { background: #eab308; box-shadow: 0 0 4px rgba(234, 179, 8, 0.4); }
    .grid-block.active.tier-4 { background: #f97316; box-shadow: 0 0 4px rgba(249, 115, 22, 0.4); }
    .grid-block.active.tier-5 {
      background: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
      animation: pulse-block 0.35s infinite alternate;
    }
    @keyframes pulse-block {
      from { opacity: 0.65; transform: scaleY(0.92); }
      to { opacity: 1; transform: scaleY(1.08); }
    }

    /* Scoreboard (加一个分数板) */
    .scoreboard-container {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;    /* 否则可用宽度只有半屏，内容会被折行 */
      z-index: 15;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .score-badge {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 2.5px solid #38bdf8;
      border-radius: 999px;
      padding: 6px 22px;
      white-space: nowrap;   /* 防止「排气量」被折成两行 */
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.28);
      display: flex;
      align-items: baseline;
      gap: 9px;
    }
    .score-title {
      font-size: 16px;
      font-weight: 900;
      color: #cbd5e1;
      letter-spacing: 1.5px;
    }
    .score-value {
      font-size: 30px;
      font-weight: 900;
      color: #38bdf8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 1px;
      line-height: 1.1;
    }
    .score-unit {
      font-size: 15px;
      font-weight: 800;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }
    .score-combo {
      margin-top: 3px;
      font-size: 11px;
      font-weight: 800;
      color: #10b981;
      opacity: 0;
      transform: translateY(-2px);
      transition: all 0.2s ease;
      background: rgba(16, 185, 129, 0.15);
      padding: 1px 8px;
      border-radius: 8px;
    }
    .score-combo.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Canvas Stage */
    #canvas-container {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Bottom Control Area (去掉 release) */
    .controls-panel {
      padding: 12px 18px 24px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-top: 2px solid rgba(226, 232, 240, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }
    .btn-fart {
      width: 100%;
      max-width: 380px;
      height: 64px;
      border-radius: 32px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      font-size: 21px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4), inset 0 2px 0 rgba(255, 255, 255, 0.35);
      transition: all 0.1s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-fart:active, .btn-fart.active {
      transform: scale(0.97);
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
    }
    .controls-hint {
      margin-top: 8px;
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
    }

    /* End Modal */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 50;
    }
    .modal-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 26px 22px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
    }
    /* 结算立绘：奶蛙 + 奶蛋 */
    .modal-cast {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      height: 122px;
      margin-bottom: 12px;
    }
    .modal-char { height: 100%; width: auto; object-fit: contain; }
    .modal-title { font-size: 22px; font-weight: 900; color: #0f172a; margin-bottom: 15px; }
    .modal-rank {
      display: inline-block;
      margin: 0 auto 16px;
      padding: 6px 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border: 2px solid #f59e0b;
      color: #92400e;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .modal-stats {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-around;
      gap: 10px;
    }
    .modal-stat { flex: 1; text-align: center; }
    .modal-stat-label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: #64748b;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }
    .modal-stat-value {
      display: block;
      font-size: 27px;
      font-weight: 900;
      line-height: 1.15;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .modal-stat-value.time { color: #2563eb; }
    .modal-stat-value.ml { color: #10b981; }
    .modal-stat-value em { font-size: 13px; font-style: normal; color: #94a3b8; margin-left: 2px; }
    /* 换装：纯文字选项 */
    .skin-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }
    .skin-chip {
      padding: 5px 13px;
      border-radius: 16px;
      background: #f1f5f9;
      border: 1.5px solid #cbd5e1;
      color: #334155;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .skin-chip.on {
      background: #dbeafe;
      border-color: #3b82f6;
      color: #1d4ed8;
    }
    /* 到访次数：跟换装胶囊并排，虚线边框表示这是信息而不是按钮 */
    .play-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 7px;
      padding: 5px 12px;
      border-radius: 16px;
      background: #f8fafc;
      border: 1.5px dashed #cbd5e1;
      color: #64748b;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .play-count b {
      color: #3b82f6;
      font-size: 14px;
      margin-left: 3px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 1.5px;
    }
    .btn-restart {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      background: #3b82f6;
      color: #ffffff;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 1px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- Top HUD -->
  <div class="hud-header">
    <!-- Enlarged Soundwave Visualizer (放大，其他都不要) -->
    <div class="soundwave-box danger" id="soundwave-box">
      <!-- 22 Large Equalizer Wave Bars -->
    </div>

    <!-- 5-Segment Grid Status Bars (五格子带颜色 + 警示察觉程度) -->
    <div class="bars-row">
      <!-- Gas Blocks (肚肚胀气值) -->
      <div class="stat-card">
        <div class="stat-label-row">
          <span class="stat-status-badge" id="gas-badge" style="background:#fef3c7; color:#b45309;">⚠️ 40%</span>
        </div>
        <div class="grid-blocks-container" id="gas-grid">
          <div class="grid-block" data-idx="1"></div>
          <div class="grid-block" data-idx="2"></div>
          <div class="grid-block" data-idx="3"></div>
          <div class="grid-block" data-idx="4"></div>
          <div class="grid-block" data-idx="5"></div>
        </div>
      </div>

      <!-- Suspicion Blocks (同伴怀疑度 + 警示察觉程度) -->
      <div class="stat-card">
        <div class="stat-label-row">
          <span class="stat-status-badge" id="sus-badge" style="background:#f1f5f9; color:#475569;">😴 发呆中</span>
        </div>
        <div class="grid-blocks-container" id="sus-grid">
          <div class="grid-block" data-idx="1"></div>
          <div class="grid-block" data-idx="2"></div>
          <div class="grid-block" data-idx="3"></div>
          <div class="grid-block" data-idx="4"></div>
          <div class="grid-block" data-idx="5"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Stage Canvas -->
  <div id="canvas-container">
    <!-- Scoreboard (加一个分数板) -->
    <div class="scoreboard-container">
      <div class="score-badge">
        <span class="score-title">排气量</span>
        <span class="score-value" id="score-val">000000</span>
        <span class="score-unit">ml</span>
      </div>
      <div class="score-combo" id="score-combo">COMBO ×2 🔥</div>
    </div>

    <canvas id="game-canvas"></canvas>
  </div>

  <!-- Bottom Controls (去掉 release) -->
  <div class="controls-panel">
    <button class="btn-fart" id="fart-btn">
      <span>💨</span>
      <span>长按偷偷排气</span>
    </button>
    <div class="skin-row" id="skin-row">
      <button class="skin-chip" data-skin="floral">花肚兜</button>
      <button class="skin-chip" data-skin="luke">Luke</button>
      <button class="skin-chip" data-skin="tea">冰红茶</button>
      <button class="skin-chip" data-skin="secret">奶秘</button>
    </div>
    <div class="play-count" id="play-count">奶家人到访次数：<b id="play-count-num">读取中</b></div>
    <div class="controls-hint">按住屏幕或空格键排气 • 松手立刻憋住伪装</div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="end-modal">
    <div class="modal-card">
      <div class="modal-cast">
        <img class="modal-char" id="modal-frog" alt="奶蛙">
      </div>
      <div class="modal-title" id="modal-title">被奶蛋抓个正着！</div>
      <div class="modal-rank" id="modal-rank">胀气</div>
      <div class="modal-stats">
        <div class="modal-stat">
          <span class="modal-stat-label">偷放屁时间</span>
          <span class="modal-stat-value time" id="stat-time">0s</span>
        </div>
        <div class="modal-stat">
          <span class="modal-stat-label">放屁量</span>
          <span class="modal-stat-value ml" id="stat-score">0<em>ml</em></span>
        </div>
      </div>
      <button class="btn-restart" id="restart-btn">再来一局</button>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   Sound Engine (保持音效不变)
   ========================================================================== */
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.enabled = true;
  }
  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioContext();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  toggle() {
    this.enabled = !this.enabled;
    return this.enabled;
  }
  playFart(pitch = 110, length = 0.28) {
    if (!this.enabled || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const filter = this.ctx.createBiquadFilter();

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(340, now);
      filter.frequency.linearRampToValueAtTime(140, now + length);

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(pitch + (Math.random() * 20 - 10), now);
      osc.frequency.linearRampToValueAtTime(pitch * 0.65, now + length);

      const bufSize = Math.floor(this.ctx.sampleRate * length);
      const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.12));
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buf;
      const noiseGain = this.ctx.createGain();
      noiseGain.gain.setValueAtTime(0.25, now);
      noiseGain.gain.linearRampToValueAtTime(0.01, now + length);

      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + length);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      noise.connect(noiseGain);
      noiseGain.connect(this.ctx.destination);

      osc.start(now);
      noise.start(now);
      osc.stop(now + length);
      noise.stop(now + length);
    } catch(e) {}
  }
  playThunder() {
    if (!this.enabled || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const dur = 3.2;
      const bufSize = Math.floor(this.ctx.sampleRate * dur);
      const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < bufSize; i++) {
        const white = Math.random() * 2 - 1;
        data[i] = (last + (0.03 * white)) / 1.03;
        last = data[i];
        data[i] *= 3.0;
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buf;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(260, now);
      filter.frequency.linearRampToValueAtTime(80, now + dur);

      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.45, now + 0.35);
      gain.gain.linearRampToValueAtTime(0.01, now + dur);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start(now);
      noise.stop(now + dur);
    } catch(e) {}
  }
  playWarning() {
    if (!this.enabled || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.linearRampToValueAtTime(660, now + 0.15);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.2);
    } catch(e) {}
  }
  playCaught() {
    if (!this.enabled || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(750, now);
      osc.frequency.setValueAtTime(320, now + 0.18);
      osc.frequency.setValueAtTime(750, now + 0.35);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.6);
    } catch(e) {}
  }
  playWhistle() {
    if (!this.enabled || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1100, now);
      osc.frequency.linearRampToValueAtTime(1450, now + 0.22);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.26);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.26);
    } catch(e) {}
  }
  playExplode() {
    if (!this.enabled || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const dur = 1.0;
      const bufSize = Math.floor(this.ctx.sampleRate * dur);
      const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.15));
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buf;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.linearRampToValueAtTime(0.01, now + dur);
      noise.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start(now);
      noise.stop(now + dur);
    } catch(e) {}
  }
  playWin() {
    if (!this.enabled || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.12);

/* 外部素材覆盖（可选）：同级目录放同名文件即可替换内嵌精灵图。
   默认「不探测」——否则线上每次加载都会多出 12 个 404 请求。
   需要替换建模时，用 ?custom=1 打开本页即可开启探测。 */
const ALLOW_SPRITE_OVERRIDE = /[?&]custom=1(&|$)/.test(location.search);
const _overrideProbes = [];   // 持有引用，防止探测用的 Image 被 GC 回收导致覆盖失效
function trySpriteOverride(img, url) {
  if (!ALLOW_SPRITE_OVERRIDE) return;
  const probe = new Image();
  _overrideProbes.push(probe);
  probe.onload = () => { img.src = url; };
  probe.src = url;
}
trySpriteOverride(spriteIdle, "player-idle.png");

trySpriteOverride(spriteSkinSecret, "skin-secret.png");

trySpriteOverride(eggSide, "watcher-side.png");
trySpriteOverride(eggFront, "watcher-front.png");

/* ==========================================================================
   Input Handling (去掉了 Release，纯按住排气)
   ========================================================================== */
function startFart() {
  if (!isPlaying) return;
  sounds.init();
  if (!isFarting) {
    isFarting = true;
    fartVolume = 0;          // 新的一泡屁，从头开始算
    bystanderHold = BYSTANDER_HOLD;
    // 连击：在起风掩护里起手算一档，安静期起手直接清零
    comboCount = isCoverActive ? comboCount + 1 : 0;
    scoreCombo.textContent = `COMBO ×${comboCount} 🔥`;
    fartBtn.classList.add('active');
    sounds.playFart(110, 0.26);
    lastFartSoundTime = Date.now();
  }
}

function stopFart() {
  if (isFarting) {
    isFarting = false;
    fartBtn.classList.remove('active');
    if (isPlaying && suspicion < 80) {
      sounds.playWhistle();
    }
  }
}

fartBtn.addEventListener('mousedown', (e) => { e.preventDefault(); startFart(); });
window.addEventListener('mouseup', () => stopFart());
fartBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startFart(); }, { passive: false });
window.addEventListener('touchend', () => stopFart());
window.addEventListener('touchcancel', () => stopFart());

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !e.repeat) {
    e.preventDefault();
    startFart();
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    stopFart();
  }
});

/* ==========================================================================
   Particle System: Billowing Green Clouds (放绿色的屁)
   ========================================================================== */
/* dir: -1 = 朝左喷（默认），+1 = 朝右喷（超级大屁调头对着奶蛋） */
function spawnGreenFart(x, y, dir) {
  const d = (dir === undefined) ? -1 : dir;
  const baseAngle = d < 0 ? Math.PI * 0.95 : Math.PI * 0.05;
  const angle = baseAngle + (Math.random() - 0.5) * 0.8;
  const speed = 2.8 + Math.random() * 4.2;
  const greens = [
    "rgba(132, 204, 22, ",   // Lime
    "rgba(34, 197, 94, ",    // Emerald
    "rgba(74, 222, 128, ",   // Mint
    "rgba(163, 230, 53, ",   // Toxic lime
    "rgba(101, 163, 13, "    // Deep yellow-green
  ];
  const colorBase = greens[Math.floor(Math.random() * greens.length)];

  greenFartParticles.push({
    x: x,
    y: y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed - 0.6,
    radius: 16 + Math.random() * 18,
    alpha: 0.88,
    colorBase: colorBase
  });
}

function spawnSweat(x, y) {
  sweatDrops.push({
    x: x + (Math.random() - 0.5) * 20,
    y: y,
    vy: 1.6 + Math.random() * 2,
    alpha: 0.9,
    size: 4 + Math.random() * 3
  });
}

/* 结算称号：按最终放屁量（ml）取最高达成档 */
const FART_TITLES = [
  { ml: 8888,  label: '虚空屁神' },

  { ml: 1000,  label: '连环屁王' },
  { ml: 666,   label: '无声屁徒' },
];
function fartTitle(ml) {

    if (ml >= t.ml) return t.label;
  }
  return null;
}

/* 旁观奶蛙冒一句吐槽，累积着往上飘 */
function pushBystanderLine(key) {
  const text = BYSTANDER_LINES[key];
  if (!text) return;
  bystanderTexts.push({
    text: text,
    x: width * 0.47 + (Math.random() - 0.5) * 46,
    y: height * 0.70,
    life: 1.0,
    vy: 30 + Math.random() * 20,
  });
  if (bystanderTexts.length > 16) bystanderTexts.shift();
}

/* 超级大屁：里程奖励 —— 泄洪降压、慢放喷射、把奶蛋震晕 3 秒 */
function triggerMegaFart() {
  megaBanner = 2.6;        // 横幅展示久一点
  megaFartTimer = 1.4;     // 1.4 秒持续涌出（慢放）
  shakeTime = 0.8;
  shakePower = 15;
  gasLevel = Math.max(0, gasLevel - 22);   // 泄洪：一口气顶掉两成多胀气
  npcStunTimer = NPC_STUN_TIME;            // 奶蛋当场被震晕
  npcState = NPC_STATES.STUNNED;
  const px = width * 0.32 + 64;   // 朝右偏，对着奶蛋喷
  const py = height * 0.72 - 58;
  for (let i = 0; i < 18; i++) {
    spawnGreenFart(px + (Math.random() - 0.5) * 150,
                   py + (Math.random() - 0.5) * 150, 1);
  }
  sounds.playThunder();
  sounds.playFart(58, 0.5);
}

function updateAndDrawParticles() {
  // Green Clouds
  for (let i = greenFartParticles.length - 1; i >= 0; i--) {
    const p = greenFartParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.radius += 0.6;
    p.alpha -= 0.022;

    if (p.alpha <= 0) {
      greenFartParticles.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.fillStyle = `${p.colorBase}${p.alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Sweat Drops
  for (let i = sweatDrops.length - 1; i >= 0; i--) {
    const s = sweatDrops[i];
    s.y += s.vy;
    s.alpha -= 0.035;

    if (s.alpha <= 0) {
      sweatDrops.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.fillStyle = `rgba(56, 189, 248, ${s.alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

/* ==========================================================================
   Game Loop
   ========================================================================== */
let lastFrameTime = performance.now();

function update(dt) {
  // 纯视觉计时器即使结算了也要继续走完，否则震动和横幅会卡住
  if (megaBanner > 0) megaBanner = Math.max(0, megaBanner - dt);
  if (shakeTime > 0) shakeTime = Math.max(0, shakeTime - dt);
  for (let i = bystanderTexts.length - 1; i >= 0; i--) {
    const bt2 = bystanderTexts[i];
    bt2.life -= dt * 0.48;
    bt2.y -= bt2.vy * dt;
    if (bt2.life <= 0) bystanderTexts.splice(i, 1);
  }

  if (!isPlaying) return;

  elapsedSeconds += dt;

  // 1. Gas Accumulation
  gasLevel += 3.8 * dt;

  // 2. Farting & Score
  if (isFarting) {
    fartSeconds += dt;                 // 累计偷放屁时间，结算用
    const vent = 24 * dt;
    gasLevel = Math.max(0, gasLevel - vent);

    // 「只要一放屁就计量」：基础 70ml/s，按下即开始涨，起风掩护期再乘 1.8。
    // 用浮点累加、显示时才取整，避免高刷屏下某些帧四舍五入成 0 而看着卡住不动。
    const gain = 70 * dt * (isCoverActive ? 1.8 : 1);
    score += gain;
    fartVolume += gain;      // 单次放屁量：旁观奶蛙据此变脸

    if (isCoverActive || npcStunTimer > 0) {
      // 起风了 / 奶蛋被震晕：它什么都听不到，随便放，怀疑度还会回落
      suspicion = Math.max(0, suspicion - 16 * dt);
    } else {
      // 安静期：怀疑度上升
      suspicion += NPC_TUNING.suspicionRate * dt;
      if (npcState === NPC_STATES.IDLE && suspicion > 20) {
        npcState = NPC_STATES.SUSPICIOUS;
        npcStateTimer = NPC_TUNING.idleToSusMin;
        sounds.playWarning();
      }
    }

    if (Date.now() - lastFartSoundTime > 230) {
      sounds.playFart(100 + Math.random() * 30, 0.22);
      lastFartSoundTime = Date.now();
    }
  } else {
    suspicion = Math.max(0, suspicion - 18 * dt);
  }

  // 3. Environmental Cover Cycle
  if (isCoverActive) {
    coverEventTimer -= dt;
    if (coverEventTimer <= 0) {
      isCoverActive = false;
      nextCoverEventTimer = 7.0 + Math.random() * 6.0;   // 起风间隔拉长
    }
  } else {
    nextCoverEventTimer -= dt;
    if (nextCoverEventTimer <= 0) {
      isCoverActive = true;
      coverEventTimer = 2.4 + Math.random() * 1.6;       // 单次起风时长略短
      sounds.playThunder();
    }
  }

  // 4. 奶蛋 AI（灵敏度见 NPC_TUNING；被超级大屁震晕时整段跳过）
  if (npcStunTimer > 0) {
    npcStunTimer -= dt;
    npcState = NPC_STATES.STUNNED;
    suspicion = Math.max(0, suspicion - 26 * dt);
    if (npcStunTimer <= 0) {
      npcState = NPC_STATES.IDLE;
      nextNpcCheckTimer = NPC_TUNING.patrolMin;
    }
  } else if (isCoverActive) {
    // 起风了：风声盖过一切，奶蛋根本不会转头扫描察觉，老老实实背对着
    npcState = NPC_STATES.IDLE;
    npcStateTimer = 0;
    npcReactTimer = 0;
    nextNpcCheckTimer = Math.max(nextNpcCheckTimer, 1.6);
  } else if (npcState === NPC_STATES.IDLE) {
    nextNpcCheckTimer -= dt;
    if (nextNpcCheckTimer <= 0) {
      npcState = NPC_STATES.SUSPICIOUS;
      npcStateTimer = NPC_TUNING.idleToSusMin
                    + Math.random() * (NPC_TUNING.idleToSusMax - NPC_TUNING.idleToSusMin);
      sounds.playWarning();
    }
  } else if (npcState === NPC_STATES.SUSPICIOUS) {
    npcStateTimer -= dt;
    if (npcStateTimer <= 0) {
      npcState = NPC_STATES.WATCHING;
      npcStateTimer = NPC_TUNING.susToWatchMin
                    + Math.random() * (NPC_TUNING.susToWatchMax - NPC_TUNING.susToWatchMin);
      npcReactTimer = NPC_TUNING.reactDelay;
    }
  } else if (npcState === NPC_STATES.WATCHING) {
    if (npcReactTimer > 0) npcReactTimer -= dt;
    if (isFarting && npcReactTimer <= 0) {
      gameOver('caught');
      return;
    }
    npcStateTimer -= dt;
    if (npcStateTimer <= 0) {
      npcState = NPC_STATES.IDLE;
      nextNpcCheckTimer = NPC_TUNING.patrolMin
                        + Math.random() * (NPC_TUNING.patrolMax - NPC_TUNING.patrolMin);
    }
  }

  // 5. Check Game Over（无倒计时：仅「爆炸社死」/「被抓现行」两种结局）
  if (gasLevel >= 100) {
    gameOver('exploded');
    return;
  }
  if (suspicion >= 100) {
    gameOver('caught');
    return;
  }

  // 5.5 超级大屁：每累计 MEGA_FART_STEP 毫升自动爆一发
  if (score >= nextMegaFartAt) {
    nextMegaFartAt += MEGA_FART_STEP;
    triggerMegaFart();
  }
  // 慢放：喷射持续 1.4 秒慢慢涌出，而不是一帧炸完。
  // 奶蛙已调头朝右，烟往奶蛋方向飞（dir = +1）。
  if (megaFartTimer > 0) {
    megaFartTimer -= dt;
    const mx = width * 0.32 + 64;
    const my = height * 0.72 - 58;
    for (let i = 0; i < 3; i++) {
      spawnGreenFart(mx + (Math.random() - 0.5) * 150,
                     my + (Math.random() - 0.5) * 150, 1);
    }
  }

  // 6. Bystander reaction tier（按「单次放屁量」升档，松手 1.5 秒后回到嫌弃）
  let bt = 0;
  for (let i = 0; i < BYSTANDER_TIERS.length; i++) {
    if (fartVolume >= BYSTANDER_TIERS[i].ml) bt = i;
  }
  if (isFarting) {
    bystanderHold = BYSTANDER_HOLD;
  } else if (bystanderHold > 0) {
    bystanderHold -= dt;
  } else {
    bt = 0;                       // 收工，回到嫌弃
    fartVolume = 0;
  }
  if (bt !== bystanderTier) {
    bystanderTier = bt;
    bystanderPop = 1.0;
    pushBystanderLine(BYSTANDER_TIERS[bt].key);
    bystanderLineTimer = BYSTANDER_LINE_INTERVAL;
  }
  if (bystanderPop > 0) bystanderPop = Math.max(0, bystanderPop - dt * 1.6);

  // 同档位持续补字，让吐槽一条条累积着飘上去
  if (isFarting && bystanderHold > 0) {
    bystanderLineTimer -= dt;
    if (bystanderLineTimer <= 0) {
      bystanderLineTimer = BYSTANDER_LINE_INTERVAL;
      pushBystanderLine(BYSTANDER_TIERS[bystanderTier].key);
    }
  }

  // 7. Update UI (Grids & Score)
  updateHUDGrids();
}

function updateHUDGrids() {
  // 1. Update Scoreboard
  scoreVal.textContent = String(Math.floor(score)).padStart(6, '0');
  if (isFarting && isCoverActive && comboCount >= 2) {
    scoreCombo.classList.add('show');
  } else {
    scoreCombo.classList.remove('show');
  }

  // 2. Update 5-Grid Gas Blocks (五格子带颜色)
  // Each block = 20%
  const activeGasBlocks = Math.min(5, Math.ceil(gasLevel / 20));
  const gasTiers = ['tier-1', 'tier-2', 'tier-3', 'tier-4', 'tier-5'];
  gasBlocks.forEach((block, idx) => {
    block.className = 'grid-block';
    if (idx < activeGasBlocks) {
      block.classList.add('active', gasTiers[idx]);
    }
  });
  // Gas badge label
  const gasPercent = Math.round(Math.min(100, gasLevel));
  if (activeGasBlocks >= 5) {
    gasBadge.textContent = `💥 危急 100%`;
    gasBadge.style.background = '#fee2e2';
    gasBadge.style.color = '#ef4444';
  } else {
    gasBadge.textContent = `⚠️ ${gasPercent}%`;
    gasBadge.style.background = activeGasBlocks >= 4 ? '#ffedd5' : activeGasBlocks >= 3 ? '#fef3c7' : '#ecfdf5';
    gasBadge.style.color = activeGasBlocks >= 4 ? '#c2410c' : activeGasBlocks >= 3 ? '#b45309' : '#047857';
  }

  // 3. Update 5-Grid Suspicion Blocks + 警示察觉程度
  const activeSusBlocks = Math.min(5, Math.ceil(suspicion / 20));
  susBlocks.forEach((block, idx) => {
    block.className = 'grid-block';
    if (idx < activeSusBlocks) {
      block.classList.add('active', gasTiers[idx]);
    }
  });

  // Awareness stages (警示察觉程度)
  if (activeSusBlocks === 0) {
    susBadge.textContent = '😴 发呆中';
    susBadge.style.background = '#f1f5f9';
    susBadge.style.color = '#64748b';
  } else if (activeSusBlocks === 1) {
    susBadge.textContent = '🟢 安全';
    susBadge.style.background = '#ecfdf5';
    susBadge.style.color = '#059669';
  } else if (activeSusBlocks === 2) {
    susBadge.textContent = '🟡 微觉';
    susBadge.style.background = '#fefce8';
    susBadge.style.color = '#84cc16';
  } else if (activeSusBlocks === 3) {
    susBadge.textContent = '🟠 起疑';
    susBadge.style.background = '#fef3c7';
    susBadge.style.color = '#d97706';
  } else if (activeSusBlocks === 4) {
    susBadge.textContent = '🔴 警觉';
    susBadge.style.background = '#ffedd5';
    susBadge.style.color = '#ea580c';
  } else {
    susBadge.textContent = '⚠️ 极危！回头中';
    susBadge.style.background = '#fee2e2';
    susBadge.style.color = '#dc2626';
  }

  // 4. Equalizer Waveform Bars (放大，其他文字全去)
  const now = Date.now();
  if (isCoverActive) {
    soundwaveBox.className = 'soundwave-box safe';
    waveBars.forEach((bar, idx) => {
      const wave = Math.sin(now * 0.016 + idx * 0.7);
      const wave2 = Math.cos(now * 0.024 + idx * 1.2);
      const h = 24 + (wave * 12) + (wave2 * 9);
      bar.style.height = `${Math.max(10, Math.min(46, h))}px`;
      bar.style.backgroundColor = '#10b981';
    });
  } else {
    soundwaveBox.className = 'soundwave-box danger';
    waveBars.forEach((bar, idx) => {
      const wave = Math.sin(now * 0.005 + idx * 0.5);
      const h = 6 + wave * 3;
      bar.style.height = `${Math.max(4, h)}px`;
      bar.style.backgroundColor = '#cbd5e1';
    });
  }
}

function render() {
  ctx.clearRect(0, 0, width, height);

  // 屏幕震动（超级大屁 / 爆炸社死）
  ctx.save();
  if (shakeTime > 0) {
    const k = Math.min(1, shakeTime / 0.55);
    ctx.translate((Math.random() - 0.5) * shakePower * k,
                  (Math.random() - 0.5) * shakePower * k);
  }

  // 极简风：不画任何场景，只在 pondY 留一条地平线，角色站在上面
  const pondY = height * 0.72;

  ctx.save();
  ctx.strokeStyle = "rgba(15, 23, 42, 0.10)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, pondY);
  ctx.lineTo(width, pondY);
  ctx.stroke();
  ctx.restore();


  // 奶蛋抓现行的「扫描框」：整体上移，并像探照灯那样上下扫动
  if (npcState === NPC_STATES.WATCHING) {
    const sweep = Math.sin(Date.now() * 0.0024) * 48;
    ctx.save();
    ctx.fillStyle = "rgba(239, 68, 68, 0.27)";
    ctx.beginPath();
    ctx.moveTo(width * 0.74, pondY - 120 + sweep * 0.28);
    ctx.lineTo(width * 0.33, pondY - 200 + sweep);
    ctx.lineTo(width * 0.33, pondY - 12 + sweep);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /* 统一角色绘制：按「目标高度 + 底边锚点」等比缩放。
     anchorX 是水平锚点（0=左缘对齐 cx，0.5=中心对齐，1=右缘对齐），
     精灵图换成任何尺寸都不会变形。 */
  const drawChar = (img, cx, baseY, targetH, anchorX, dx, dy) => {
    if (!img || !img.complete || !img.naturalWidth) return null;
    const w = targetH * (img.naturalWidth / img.naturalHeight);
    const x = cx - w * anchorX + (dx || 0);
    const y = baseY - targetH + (dy || 0);
    ctx.drawImage(img, x, y, w, targetH);
    return { x, y, w, h: targetH };
  };

  // 1. 左侧玩家奶蛙
  const playerX = width * 0.32;
  const playerY = pondY - 14;

  // 落地软影：不然室内地板上一站就像飘着
  ctx.save();
  ctx.fillStyle = "rgba(92, 64, 38, 0.20)";
  ctx.beginPath();
  ctx.ellipse(playerX, playerY - 3, 60, 11, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 超级大屁期间：整只水平镜像，屁股调头朝右，正对着奶蛋喷
  const megaBlast = megaFartTimer > 0;
  if (isFarting || megaBlast) {
    // 深蹲背身形态：本体偏在画面右侧、左侧是排气浓烟，故锚点右移
    const wx = (Math.random() - 0.5) * 3;
    const wy = (Math.random() - 0.5) * 2;
    ctx.save();
    if (megaBlast) {                 // 镜像后尾气跑到右边
      ctx.translate(playerX * 2, 0);
      ctx.scale(-1, 1);
    }
    const box = drawChar(spriteFart, playerX, playerY, 238, 0.58, wx, wy);
    ctx.restore();
    if (box) {
      // 粒子直接生在「精灵图里已经画好的那团尾气」范围上，新烟与自带的尾气
      // 叠成一团持续翻滚的浓烟，而不是在屁股边上另起一坨分家的云。
      const dir = megaBlast ? 1 : -1;
      const sx = megaBlast ? (0.66 + Math.random() * 0.30)   // 镜像后尾气在右半边
                           : (0.03 + Math.random() * 0.27);
      const sy = 0.48 + Math.random() * 0.28;   // 尾气纵向范围
      const px = box.x + box.w * sx + wx;
      const py = box.y + box.h * sy + wy;
      spawnGreenFart(px, py, dir);
      spawnGreenFart(px, py, dir);
    }
  } else {
    let tremX = 0;
    if (gasLevel > 70) {
      tremX = Math.sin(Date.now() * 0.04) * ((gasLevel - 70) / 30 * 2.5);
      if (Math.random() < 0.16) spawnSweat(playerX - 20, playerY - 130);
    }
    // 胀气越高整体等比撑大（不再横向拉伸，避免把新素材拉变形）
    const gasScale = 1.0 + (gasLevel / 100) * 0.07;
    const skinImg = activeSkin ? SKIN_SPRITES[activeSkin] : null;
    const idleImg = (skinImg && skinImg.complete && skinImg.naturalWidth)
      ? skinImg : spriteIdle;
    drawChar(idleImg, playerX, playerY, 248 * gasScale, 0.5, tremX, 0);
  }

  // 2. 右侧监视者奶蛋：三态对应三视图（背对 → 猛地转正 → 侧身锁定玩家）
  const npcX = width * 0.76;
  const npcY = pondY - 12;

  ctx.save();
  ctx.fillStyle = "rgba(92, 64, 38, 0.20)";
  ctx.beginPath();
  ctx.ellipse(npcX, npcY - 3, 56, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  const npcImg = npcState === NPC_STATES.WATCHING ? eggSide      // 侧身：真盯着玩家
               : npcState === NPC_STATES.SUSPICIOUS ? eggFront   // 正面：猛地转向你
               : eggBack;                                        // 背对：压根没在看你
  let npcBox;
  if (npcState === NPC_STATES.STUNNED) {
    // 被超级大屁震晕：原地晃悠
    ctx.save();
    ctx.translate(npcX, npcY);
    ctx.rotate(Math.sin(Date.now() * 0.017) * 0.14);
    ctx.translate(-npcX, -npcY);
    npcBox = drawChar(eggBack, npcX, npcY, 232, 0.5, 0, 0);
    ctx.restore();
  } else {
    npcBox = drawChar(npcImg, npcX, npcY, 232, 0.5, 0, 0);
  }

  // 头顶提示符号：直接显示 emoji（不加边框），水平居中于奶蛋头顶。
  // 竖直方向夹在 SCOREBOARD_SAFE_Y 以下，避免和顶部的「排气量」得分板叠在一起。
  const npcTop = npcBox ? npcBox.y : npcY - 232;
  const GLYPH_HALF = 38;
  const SCOREBOARD_SAFE_Y = 108;  // 得分板下沿 + 余量（canvas 坐标）
  if (npcState === NPC_STATES.SUSPICIOUS || npcState === NPC_STATES.WATCHING) {
    const isCatch = npcState === NPC_STATES.WATCHING;
    const bob = Math.sin(Date.now() * 0.006) * 5;
    const gy = Math.max(npcTop - GLYPH_HALF + bob, SCOREBOARD_SAFE_Y);
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "66px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
    // 注：❓❗ 在 macOS 上走 Apple Color Emoji 彩色字形，fillStyle 不生效、
    // 两者本来都是红色，靠光晕颜色 + 字形区分。若要「琥珀色问号 / 红色叹号」
    // 的强对比，把下面的字形换成 ASCII 的 "?" / "!" 并设 fillStyle 即可。
    ctx.shadowColor = isCatch ? "rgba(239,68,68,0.85)" : "rgba(234,179,8,0.85)";
    ctx.shadowBlur = isCatch ? 18 : 12;
    ctx.fillText(isCatch ? "❗" : "❓", npcX, gy);
    ctx.restore();
  }

  // 被震晕：头顶转圈的星星
  if (npcState === NPC_STATES.STUNNED) {
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "26px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
    const t = Date.now() * 0.0042;
    const oy = Math.max(npcTop - 26, SCOREBOARD_SAFE_Y);
    for (let i = 0; i < 3; i++) {
      const a = t + i * (Math.PI * 2 / 3);
      ctx.fillText("💫", npcX + Math.cos(a) * 36, oy + Math.sin(a) * 9);
    }
    ctx.restore();
  }

  // 3. Draw Bystander Milk Frog (旁观奶蛙，站在画面前景中下方)
  {
    const tier = BYSTANDER_TIERS[bystanderTier];
    const img = bystanderSprites[tier.key];
    if (img && img.complete && img.naturalWidth) {
      const ratio = img.naturalWidth / img.naturalHeight;
      const pop = bystanderPop > 0 ? 1 + Math.sin(bystanderPop * Math.PI) * 0.16 : 1;
      // 单次放屁量破 800ml：惊吓升级成「狂暴」——整体撑大 + 高频抖动
      const rage = fartVolume >= BYSTANDER_RAGE_ML;
      const bh = Math.min(150, height * 0.34) * pop * (rage ? 1.20 : 1);
      const bw = bh * ratio;
      const bx = width * 0.47 + (rage ? (Math.random() - 0.5) * 7 : 0);
      const baseY = height * 0.99;
      const bob = rage ? (Math.random() - 0.5) * 9
                       : Math.sin(Date.now() * 0.003) * 3;

      ctx.drawImage(img, bx - bw / 2, baseY - bh + bob, bw, bh);

    }
  }

  // 4. Green Fart Smoke and Sweat
  updateAndDrawParticles();

  // 5. 旁观奶蛙的累积吐槽（一条条往上飘）
  for (const bt2 of bystanderTexts) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, bt2.life * 1.7));
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "900 19px 'Lantinghei SC','PingFang SC','Microsoft YaHei',sans-serif";
    ctx.lineWidth = 5.5;
    ctx.strokeStyle = "rgba(255, 255, 255, 0.95)";
    ctx.strokeText(bt2.text, bt2.x, bt2.y);
    ctx.fillStyle = "#0f172a";
    ctx.fillText(bt2.text, bt2.x, bt2.y);
    ctx.restore();
  }

  // 6. 超级大屁横幅：先正常显示，退场时一边放大一边变淡
  if (megaBanner > 0) {
    const FADE = 1.0;                                   // 退场时长
    const k = megaBanner > FADE ? 1 : Math.max(0, megaBanner / FADE);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.translate(width * 0.5, height * 0.28);
    ctx.scale(1 + (1 - k) * 0.9, 1 + (1 - k) * 0.9);    // 放大到 1.9 倍
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "900 34px 'Lantinghei SC','PingFang SC','Microsoft YaHei',sans-serif";
    ctx.lineWidth = 7;
    ctx.strokeStyle = "rgba(15, 23, 42, 0.9)";
    ctx.strokeText("💨 超级大屁！", 0, 0);
    ctx.fillStyle = "#86efac";
    ctx.fillText("💨 超级大屁！", 0, 0);
    ctx.restore();
  }

  // 7. 绿色浓烟：放屁量越攒越多，画面被自己的屁一层层糊住，
  //    到 GREEN_FOG_FULL_ML 毫升就彻底看不见了。
  const fog = Math.min(1, score / GREEN_FOG_FULL_ML);
  if (fog > 0.002) {
    ctx.save();
    const fg = ctx.createLinearGradient(0, 0, 0, height);
    fg.addColorStop(0, `rgba(134, 239, 172, ${fog})`);
    fg.addColorStop(1, `rgba(21, 128, 61, ${fog})`);
    ctx.fillStyle = fg;
    ctx.fillRect(0, 0, width, height);

    // 叠几团缓慢游走的浓烟，免得看起来像一层死板的绿色滤镜
    const ft = Date.now() * 0.0004;
    ctx.globalAlpha = fog * 0.45;
    for (let i = 0; i < 7; i++) {
      const a = ft + i * 0.9;
      const fx = width * (0.5 + Math.cos(a) * 0.42);
      const fy = height * (0.5 + Math.sin(a * 1.3) * 0.42);
      const fr = Math.min(width, height) * (0.28 + 0.12 * Math.sin(a * 2));
      const rg = ctx.createRadialGradient(fx, fy, 0, fx, fy, fr);
      rg.addColorStop(0, "rgba(163, 230, 53, 0.95)");
      rg.addColorStop(1, "rgba(163, 230, 53, 0)");
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(fx, fy, fr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  ctx.restore();   // 结束屏幕震动位移
}

function gameLoop(currentTime) {
  const dt = Math.min(0.1, (currentTime - lastFrameTime) / 1000);
  lastFrameTime = currentTime;

  update(dt);
  render();

  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

/* ==========================================================================
   玩家人次：进页面时上报一次，并把总数显示在页面最下方。
   本地用 file:// 打开、或接口不可用时，整块直接隐藏，不留空行。
   ========================================================================== */
(function initPlayCount() {
  const box = document.getElementById('play-count');
  const num = document.getElementById('play-count-num');
  if (!box || !num) return;
  fetch('/api/plays', { method: 'POST' })
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error('bad status'))))
    .then((d) => {
      if (d && typeof d.total === 'number') {
        num.textContent = String(d.total).padStart(4, '0');   // 补零到 4 位
      } else {
        box.style.display = 'none';
      }
    })
    .catch(() => { box.style.display = 'none'; });
})();

/* ==========================================================================
   End Game
   ========================================================================== */
function gameOver(reason) {
  isPlaying = false;
  isFarting = false;
  fartBtn.classList.remove('active');

  const title = fartTitle(Math.floor(score));
  if (title) {
    modalRank.textContent = title;
    modalRank.style.display = 'inline-block';
  } else {
    modalRank.style.display = 'none';
  }
  statTime.textContent = `${fartSeconds.toFixed(1)}s`;
  statScore.innerHTML = `${Math.floor(score).toLocaleString()}<em>ml</em>`;
  // 结算立绘跟着结局走：炸了就用放屁形态，被抓就保持静态
  modalFrog.src = reason === 'exploded' ? spriteFart.src : spriteIdle.src;

  if (reason === 'exploded') {
    sounds.playExplode();
    // 憋不住的终局：先把这一下炸给玩家看，再弹结算面板
    shakeTime = 0.9;
    shakePower = 24;
    const bx = width * 0.32;
    const by = height * 0.72 - 70;
    for (let i = 0; i < 90; i++) {
      spawnGreenFart(bx + (Math.random() - 0.5) * 240,
                     by + (Math.random() - 0.5) * 210);
    }
    modalTitle.textContent = "惊天巨响！当场社死！";
    setTimeout(() => { endModal.style.display = 'flex'; }, 850);
    return;
  }

  sounds.playCaught();
  modalTitle.textContent = "被奶蛋抓个正着！";

  endModal.style.display = 'flex';
}

/* 换装：点某项即换，再点当前项回到原样 */
document.querySelectorAll('.skin-chip').forEach((btn) => {
  btn.addEventListener('click', () => {
    sounds.init();                     // 借这次点击解锁音频上下文
    const key = btn.dataset.skin;
    activeSkin = (activeSkin === key) ? null : key;
    document.querySelectorAll('.skin-chip').forEach((b) => {
      b.classList.toggle('on', b.dataset.skin === activeSkin);
    });
  });
});

restartBtn.addEventListener('click', () => {
  endModal.style.display = 'none';
  isPlaying = true;
  isFarting = false;
  gasLevel = 25;
  suspicion = 0;
  score = 0;
  elapsedSeconds = 0;
  isCoverActive = false;
  nextCoverEventTimer = 7.0;
  npcState = NPC_STATES.IDLE;
  nextNpcCheckTimer = 4.0;
  bystanderTier = 0;
  bystanderPop = 0;
  bystanderHold = 0;
  fartVolume = 0;
  nextMegaFartAt = MEGA_FART_STEP;
  megaBanner = 0;
  megaFartTimer = 0;
  shakeTime = 0;
  npcReactTimer = 0;
  npcStunTimer = 0;
  fartSeconds = 0;
  comboCount = 0;
  greenFartParticles = [];
  sweatDrops = [];
  lastFrameTime = performance.now();
});

</script>
