<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>奶蛙偷偷放屁</title>

  <!-- 添加到主屏幕后作为独立 App 运行 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="奶蛙放屁">
  <meta name="application-name" content="奶蛙放屁">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #0b1329;
      font-family: "Lantinghei SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    #game-container {
      position: relative;
      width: 100vw;
      max-width: 500px;
      height: 100vh;
      max-height: 860px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      border-radius: 20px;
      overflow: hidden;
    }

    /* Top HUD */
    .hud-header {
      padding: 12px 16px 8px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid rgba(226, 232, 240, 0.9);
      z-index: 10;
    }

    /* Large Soundwave Visualizer Box (放大，其他都不要) */
    .soundwave-box {
      width: 100%;
      height: 52px;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      padding: 0 14px;
      margin-bottom: 10px;
      transition: all 0.25s ease;
      overflow: hidden;
    }
    .soundwave-box.safe {
      background: #ecfdf5;
      border-color: #10b981;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.35);
    }
    .soundwave-box.danger {
      background: #f8fafc;
      border-color: #e2e8f0;
    }
    .wave-bar {
      flex: 1;
      max-width: 12px;
      height: 6px;
      border-radius: 6px;
      background: #cbd5e1;
      transition: height 0.08s ease, background-color 0.15s ease;
    }

    /* 5-Segment Grid Status Bars (五格子带颜色 + 警示察觉程度) */
    .bars-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat-card {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 7px 10px;
    }
    /* 状态区只用大图标 / 大字表达，不放小字说明 */
    .stat-label-row {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 26px;
      margin-bottom: 7px;
    }
    .stat-status-badge {
      font-size: 17px;
      font-weight: 900;
      line-height: 1.2;
      padding: 3px 12px;
      border-radius: 9px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* 5-Block Grid Container */
    .grid-blocks-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      height: 12px;
    }
    .grid-block {
      height: 100%;
      border-radius: 3px;
      background: #e2e8f0;
      transition: all 0.12s ease;
    }
    .grid-block.active.tier-1 { background: #22c55e; box-shadow: 0 0 4px rgba(34, 197, 94, 0.4); }
    .grid-block.active.tier-2 { background: #84cc16; box-shadow: 0 0 4px rgba(132, 204, 22, 0.4); }
    .grid-block.active.tier-3 { background: #eab308; box-shadow: 0 0 4px rgba(234, 179, 8, 0.4); }
    .grid-block.active.tier-4 { background: #f97316; box-shadow: 0 0 4px rgba(249, 115, 22, 0.4); }
    .grid-block.active.tier-5 {
      background: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
      animation: pulse-block 0.35s infinite alternate;
    }
    @keyframes pulse-block {
      from { opacity: 0.65; transform: scaleY(0.92); }
      to { opacity: 1; transform: scaleY(1.08); }
    }

    /* Scoreboard (加一个分数板) */
    .scoreboard-container {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;    /* 否则可用宽度只有半屏，内容会被折行 */
      z-index: 15;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .score-badge {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 2.5px solid #38bdf8;
      border-radius: 999px;
      padding: 6px 22px;
      white-space: nowrap;   /* 防止「排气量」被折成两行 */
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.28);
      display: flex;
      align-items: baseline;
      gap: 9px;
    }
    .score-title {
      font-size: 16px;
      font-weight: 900;
      color: #cbd5e1;
      letter-spacing: 1.5px;
    }
    .score-value {
      font-size: 30px;
      font-weight: 900;
      color: #38bdf8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 1px;
      line-height: 1.1;
    }
    .score-unit {
      font-size: 15px;
      font-weight: 800;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }
    .score-combo {
      margin-top: 3px;
      font-size: 11px;
      font-weight: 800;
      color: #10b981;
      opacity: 0;
      transform: translateY(-2px);
      transition: all 0.2s ease;
      background: rgba(16, 185, 129, 0.15);
      padding: 1px 8px;
      border-radius: 8px;
    }
    .score-combo.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Canvas Stage */
    #canvas-container {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Bottom Control Area (去掉 release) */
    .controls-panel {
      padding: 12px 18px 24px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-top: 2px solid rgba(226, 232, 240, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }
    .btn-fart {
      width: 100%;
      max-width: 380px;
      height: 64px;
      border-radius: 32px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      font-size: 21px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4), inset 0 2px 0 rgba(255, 255, 255, 0.35);
      transition: all 0.1s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-fart:active, .btn-fart.active {
      transform: scale(0.97);
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
    }
    .controls-hint {
      margin-top: 8px;
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
    }

    /* End Modal */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 50;
    }
    .modal-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 26px 22px;
      width: 100%;
      max-width: 360px;
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
    }
    /* 结算立绘：奶蛙 + 奶蛋 */
    .modal-cast {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      height: 122px;
      margin-bottom: 12px;
    }
    .modal-char { height: 100%; width: auto; object-fit: contain; }
    .modal-title { font-size: 22px; font-weight: 900; color: #0f172a; margin-bottom: 15px; }
    .modal-rank {
      display: inline-block;
      margin: 0 auto 16px;
      padding: 6px 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border: 2px solid #f59e0b;
      color: #92400e;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .modal-stats {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-around;
      gap: 10px;
    }
    .modal-stat { flex: 1; text-align: center; }
    .modal-stat-label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: #64748b;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }
    .modal-stat-value {
      display: block;
      font-size: 27px;
      font-weight: 900;
      line-height: 1.15;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .modal-stat-value.time { color: #2563eb; }
    .modal-stat-value.ml { color: #10b981; }
    .modal-stat-value em { font-size: 13px; font-style: normal; color: #94a3b8; margin-left: 2px; }
    .menu-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      width: 100%;
    }
    .menu-btn {
      min-width: 0;
      flex: 1;
      max-width: 180px;
      padding: 7px 10px;
      border-radius: 16px;
      background: #f1f5f9;
      border: 1.5px solid #cbd5e1;
      color: #334155;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
    }
    .menu-btn:active { background: #dbeafe; }
    .result-notice { font-size: 12px; font-weight: 800; color: #047857; min-height: 18px; margin: -10px 0 10px; }
    .result-notice.muted { color: #64748b; }
    .result-actions { margin: -8px 0 12px; }
    .sheet-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(5px);
    }
    .sheet-overlay.open { display: flex; }
    .sheet-card {
      width: 100%;
      max-width: 410px;
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
      background: #fff;
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
    }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .sheet-head h2 { font-size: 20px; color: #0f172a; }
    .sheet-close { border: 0; border-radius: 50%; width: 32px; height: 32px; background: #f1f5f9; color: #334155; font-size: 20px; cursor: pointer; }
    .sheet-subtitle { color: #64748b; font-size: 12px; font-weight: 700; margin: 8px 0 14px; }
    .board-row { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 8px; padding: 10px; border-bottom: 1px solid #e2e8f0; font-size: 14px; font-weight: 800; }
    .board-row.mine { background: #ecfdf5; border-radius: 10px; color: #047857; }
    .board-score { color: #0284c7; font-variant-numeric: tabular-nums; }
    .board-empty { text-align: center; color: #64748b; font-size: 13px; padding: 22px 8px; }
    .my-rank { margin-top: 12px; padding: 10px 12px; background: #f1f5f9; border-radius: 12px; font-size: 13px; font-weight: 800; color: #334155; }
    .roles-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .role-card { border: 2px solid #e2e8f0; background: #f8fafc; border-radius: 15px; padding: 9px; text-align: center; color: #334155; cursor: pointer; }
    .role-card.selected { border-color: #10b981; background: #ecfdf5; }
    .role-card.locked { cursor: default; color: #64748b; }
    .role-image-wrap { display: flex; align-items: center; justify-content: center; height: 100px; position: relative; }
    .role-image-wrap img { max-width: 90%; max-height: 95px; object-fit: contain; }
    .role-card.locked img { filter: grayscale(1) brightness(0.24); opacity: .48; }
    .role-lock { position: absolute; right: 8px; bottom: 0; font-size: 21px; }
    .role-name { display: block; margin-top: 5px; font-size: 14px; font-weight: 900; }
    .role-condition { display: block; margin-top: 3px; font-size: 11px; font-weight: 700; min-height: 28px; }
    /* 到访次数独立一行；接口失败时也保留状态文字。 */
    .play-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 7px;
      padding: 5px 12px;
      border-radius: 16px;
      background: #f8fafc;
      border: 1.5px dashed #cbd5e1;
      color: #64748b;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .play-count b {
      color: #3b82f6;
      font-size: 14px;
      margin-left: 3px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 1.5px;
    }
    .btn-restart {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      background: #3b82f6;
      color: #ffffff;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 1px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- Top HUD -->
  <div class="hud-header">
    <!-- Enlarged Soundwave Visualizer (放大，其他都不要) -->
    <div class="soundwave-box danger" id="soundwave-box">
      <!-- 22 Large Equalizer Wave Bars -->
    </div>

    <!-- 5-Segment Grid Status Bars (五格子带颜色 + 警示察觉程度) -->
    <div class="bars-row">
      <!-- Gas Blocks (肚肚胀气值) -->
      <div class="stat-card">
        <div class="stat-label-row">
          <span class="stat-status-badge" id="gas-badge" style="background:#fef3c7; color:#b45309;">⚠️ 40%</span>
        </div>
        <div class="grid-blocks-container" id="gas-grid">
          <div class="grid-block" data-idx="1"></div>
          <div class="grid-block" data-idx="2"></div>
          <div class="grid-block" data-idx="3"></div>
          <div class="grid-block" data-idx="4"></div>
          <div class="grid-block" data-idx="5"></div>
        </div>
      </div>

      <!-- Suspicion Blocks (同伴怀疑度 + 警示察觉程度) -->
      <div class="stat-card">
        <div class="stat-label-row">
          <span class="stat-status-badge" id="sus-badge" style="background:#f1f5f9; color:#475569;">😴 发呆中</span>
        </div>
        <div class="grid-blocks-container" id="sus-grid">
          <div class="grid-block" data-idx="1"></div>
          <div class="grid-block" data-idx="2"></div>
          <div class="grid-block" data-idx="3"></div>
          <div class="grid-block" data-idx="4"></div>
          <div class="grid-block" data-idx="5"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Stage Canvas -->
  <div id="canvas-container">
    <!-- Scoreboard (加一个分数板) -->
    <div class="scoreboard-container">
      <div class="score-badge">
        <span class="score-title">排气量</span>
        <span class="score-value" id="score-val">000000</span>
        <span class="score-unit">ml</span>
      </div>
      <div class="score-combo" id="score-combo">COMBO ×2 🔥</div>
    </div>

    <canvas id="game-canvas"></canvas>
  </div>

  <!-- Bottom Controls (去掉 release) -->
  <div class="controls-panel">
    <button class="btn-fart" id="fart-btn">
      <span>💨</span>
      <span>长按偷偷排气</span>
    </button>
    <div class="menu-row">
      <button class="menu-btn" id="roles-btn" type="button">👤 角色</button>
      <button class="menu-btn" id="leaderboard-btn" type="button">🏆 排行榜</button>
    </div>
    <div class="play-count" id="play-count">奶家人到访次数：<b id="play-count-num">读取中</b></div>
    <div class="controls-hint">按住屏幕或空格键排气 • 松手立刻憋住伪装</div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="end-modal">
    <div class="modal-card">
      <div class="modal-cast">
        <img class="modal-char" id="modal-frog" alt="奶蛙">
      </div>
      <div class="modal-title" id="modal-title">被奶蛋抓个正着！</div>
      <div class="modal-rank" id="modal-rank">胀气</div>
      <div class="modal-stats">
        <div class="modal-stat">
          <span class="modal-stat-label">偷放屁时间</span>
          <span class="modal-stat-value time" id="stat-time">0s</span>
        </div>
        <div class="modal-stat">
          <span class="modal-stat-label">放屁量</span>
          <span class="modal-stat-value ml" id="stat-score">0<em>ml</em></span>
        </div>
      </div>
      <div class="result-notice" id="unlock-notice"></div>
      <div class="result-notice muted" id="submit-notice"></div>
      <div class="menu-row result-actions">
        <button class="menu-btn" id="result-roles-btn" type="button">👤 角色</button>
        <button class="menu-btn" id="result-leaderboard-btn" type="button">🏆 排行榜</button>
      </div>
      <button class="btn-restart" id="restart-btn">再来一局</button>
    </div>
  </div>

  <div class="sheet-overlay" id="roles-modal" role="dialog" aria-modal="true" aria-labelledby="roles-title">
    <div class="sheet-card">
      <div class="sheet-head"><h2 id="roles-title">奶蛙角色</h2><button class="sheet-close" type="button" data-close-sheet aria-label="关闭角色窗口">×</button></div>
      <p class="sheet-subtitle" id="roles-progress">本机最高 0 ml · 达到称号后解锁</p>
      <div class="roles-grid" id="roles-grid"></div>
    </div>
  </div>

  <div class="sheet-overlay" id="leaderboard-modal" role="dialog" aria-modal="true" aria-labelledby="leaderboard-title">
    <div class="sheet-card">
      <div class="sheet-head"><h2 id="leaderboard-title">🏆 排行榜</h2><button class="sheet-close" type="button" data-close-sheet aria-label="关闭排行榜">×</button></div>
      <p class="sheet-subtitle">同一浏览器保留最高成绩 · 前 10 名</p>
      <div id="leaderboard-list" aria-live="polite"><div class="board-empty">读取中…</div></div>
      <div class="my-rank" id="my-rank">我的排名：读取中…</div>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   Sound Engine (保持音效不变)
   ========================================================================== */
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.enabled = true;
  }
  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioContext();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  toggle() {
    this.enabled = !this.enabled;
    return this.enabled;
  }
  playFart(pitch = 110, length = 0.28) {
    if (!this.enabled || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const filter = this.ctx.createBiquadFilter();

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(340, now);
      filter.frequency.linearRampToValueAtTime(140, now + length);

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(pitch + (Math.random() * 20 - 10), now);
      osc.frequency.linearRampToValueAtTime(pitch * 0.65, now + length);

      const bufSize = Math.floor(this.ctx.sampleRate * length);
      const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.12));
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buf;
      const noiseGain = this.ctx.createGain();
      noiseGain.gain.setValueAtTime(0.25, now);
      noiseGain.gain.linearRampToValueAtTime(0.01, now + length);

      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + length);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      noise.connect(noiseGain);
      noiseGain.connect(this.ctx.destination);

      osc.start(now);
      noise.start(now);
      osc.stop(now + length);
      noise.stop(now + length);
    } catch(e) {}
  }
  playThunder() {
    if (!this.enabled || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const dur = 3.2;

/* 外部素材覆盖（可选）：同级目录放同名文件即可替换内嵌精灵图。
   默认「不探测」——否则线上每次加载都会多出 12 个 404 请求。
   需要替换建模时，用 ?custom=1 打开本页即可开启探测。 */
const ALLOW_SPRITE_OVERRIDE = /[?&]custom=1(&|$)/.test(location.search);
const _overrideProbes = [];   // 持有引用，防止探测用的 Image 被 GC 回收导致覆盖失效
function trySpriteOverride(img, url) {
  if (!ALLOW_SPRITE_OVERRIDE) return;
  const probe = new Image();
  _overrideProbes.push(probe);
  probe.onload = () => { img.src = url; };
  probe.src = url;
}
trySpriteOverride(spriteIdle, "player-idle.png");

trySpriteOverride(spriteSkinSecret, "skin-secret.png");

trySpriteOverride(eggSide, "watcher-side.png");
trySpriteOverride(eggFront, "watcher-front.png");

function newPlayerId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  bytes[6] = (bytes[6] & 15) | 64;
  bytes[8] = (bytes[8] & 63) | 128;
  const hex = Array.from(bytes, (value) => value.toString(16).padStart(2, '0')).join('');
  return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
}

      lock.textContent = '🔒';
      wrap.appendChild(lock);
    }

async function boardRequest(body) {
  const response = await fetch('/api/leaderboard', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body),
    cache: 'no-store',
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || '排行榜暂不可用');
  return data;
}
let leaderboardRun = boardRequest({ action: 'start' }).then((data) => data.token);
leaderboardRun.catch(() => {}); // 离线打开单文件时，排行榜不可用但游戏继续。

async function submitLeaderboard(finalScore) {
  const notice = document.getElementById('submit-notice');
  notice.textContent = '成绩上传中…';
  try {
    const token = await leaderboardRun;
    const board = await boardRequest({ action: 'submit', token, playerId, score: finalScore });
    notice.textContent = board.mine ? `已记录最高成绩 · 当前第 ${board.mine.rank} 名` : '成绩已记录';
    if (document.getElementById('leaderboard-modal').classList.contains('open')) renderLeaderboard(board);
  } catch (_) {
    notice.textContent = '成绩暂未上传，可继续离线游玩';
  }
}

function renderLeaderboard(board) {
  const list = document.getElementById('leaderboard-list');
  list.replaceChildren();
  if (!board.top || board.top.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'board-empty';
    empty.textContent = '还没有成绩，等你来占第一名。';
    list.appendChild(empty);
  } else {
    for (const entry of board.top) {
      const row = document.createElement('div');
      row.className = `board-row${entry.mine ? ' mine' : ''}`;
      for (const value of [String(entry.rank), entry.name, `${Number(entry.score).toLocaleString()} ml`]) {
        const span = document.createElement('span');
        span.textContent = value;
        row.appendChild(span);
      }
      row.lastChild.className = 'board-score';
      list.appendChild(row);
    }
  }
  document.getElementById('my-rank').textContent = board.mine
    ? `我的最高：${Number(board.mine.score).toLocaleString()} ml · 第 ${board.mine.rank} 名`
    : '我的排名：完成一局后出现';
}

async function loadLeaderboard() {
  document.getElementById('leaderboard-list').textContent = '读取中…';
  document.getElementById('my-rank').textContent = '我的排名：读取中…';
  try {
    const response = await fetch(`/api/leaderboard?playerId=${encodeURIComponent(playerId)}`, { cache: 'no-store' });
    if (!response.ok) throw new Error('读取失败');
    renderLeaderboard(await response.json());
  } catch (_) {
    document.getElementById('leaderboard-list').textContent = '排行榜暂时无法读取';
    document.getElementById('my-rank').textContent = '网络恢复后再来看看';
  }
}

/* ==========================================================================
   Particle System: Billowing Green Clouds (放绿色的屁)
   ========================================================================== */
/* dir: -1 = 朝左喷（默认），+1 = 朝右喷（超级大屁调头对着奶蛋） */
function spawnGreenFart(x, y, dir) {
  const d = (dir === undefined) ? -1 : dir;
  const baseAngle = d < 0 ? Math.PI * 0.95 : Math.PI * 0.05;
  const angle = baseAngle + (Math.random() - 0.5) * 0.8;
  const speed = 2.8 + Math.random() * 4.2;
  const greens = [
    "rgba(132, 204, 22, ",   // Lime
    "rgba(34, 197, 94, ",    // Emerald
    "rgba(74, 222, 128, ",   // Mint
    "rgba(163, 230, 53, ",   // Toxic lime
    "rgba(101, 163, 13, "    // Deep yellow-green
  ];
  const colorBase = greens[Math.floor(Math.random() * greens.length)];

  greenFartParticles.push({
    x: x,
    y: y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed - 0.6,
    radius: 16 + Math.random() * 18,
    alpha: 0.88,
    colorBase: colorBase
  });
}

function spawnSweat(x, y) {
  sweatDrops.push({
    x: x + (Math.random() - 0.5) * 20,
    y: y,
    vy: 1.6 + Math.random() * 2,
    alpha: 0.9,
    size: 4 + Math.random() * 3
  });
}

function updateAndDrawParticles() {
  const now = performance.now();
  const frameScale = Math.min(6, Math.max(0, (now - lastParticleDraw) / (1000 / 60)));
  lastParticleDraw = now;
  // Green Clouds
  for (let i = greenFartParticles.length - 1; i >= 0; i--) {
    const p = greenFartParticles[i];
    p.x += (p.vx + (isCoverActive ? 7 : 0)) * frameScale;
    p.y += p.vy * frameScale;
    p.radius += (isCoverActive ? 1.0 : 0.6) * frameScale;
    p.alpha -= (isCoverActive ? 0.035 : 0.022) * frameScale;

    if (p.alpha <= 0) {
      greenFartParticles.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.fillStyle = `${p.colorBase}${p.alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Sweat Drops
  for (let i = sweatDrops.length - 1; i >= 0; i--) {
    const s = sweatDrops[i];
    s.y += s.vy * frameScale;
    s.alpha -= 0.035 * frameScale;

    if (s.alpha <= 0) {
      sweatDrops.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.fillStyle = `rgba(56, 189, 248, ${s.alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

/* ==========================================================================
   Game Loop
   ========================================================================== */
let lastFrameTime = performance.now();

function update(dt) {
  // 纯视觉计时器即使结算了也要继续走完，否则震动和横幅会卡住
  if (megaBanner > 0) megaBanner = Math.max(0, megaBanner - dt);
  if (shakeTime > 0) shakeTime = Math.max(0, shakeTime - dt);
  for (let i = bystanderTexts.length - 1; i >= 0; i--) {
    const bt2 = bystanderTexts[i];
    bt2.age += dt;
    if (bt2.age >= BYSTANDER_LINE_LIFE) bystanderTexts.splice(i, 1);
  }

  if (!isPlaying || menuOpen) return;

  elapsedSeconds += dt;

  // 1. Gas Accumulation
  gasLevel += 3.8 * dt;
  const targetGasScale = 1 + Math.min(100, gasLevel) / 100 * 0.10;
  visualGasScale += (targetGasScale - visualGasScale) * Math.min(1, dt / 0.2);

  // 2. 风周期先于计分和奶蛋 AI 推进，提示与实际安全窗口同帧切换。
  if (isCoverActive) {
    coverEventTimer -= dt;
    if (coverEventTimer <= 0) {
      isCoverActive = false;
      nextCoverEventTimer = 7.0 + Math.random() * 6.0;
    }
  } else {
    nextCoverEventTimer -= dt;
    if (nextCoverEventTimer <= 0) {
      isCoverActive = true;
      coverEventTimer = 2.4 + Math.random() * 1.6;
      sounds.playThunder();
    }
  }
  if (isCoverActive) greenFogMl *= Math.exp(-GREEN_FOG_WIND_CLEAR_RATE * dt);

  // 3. Farting & Score
  if (isFarting) {
    fartSeconds += dt;                 // 累计偷放屁时间，结算用
    const vent = 24 * dt;
    gasLevel = Math.max(0, gasLevel - vent);

    // 「只要一放屁就计量」：基础 70ml/s，按下即开始涨，起风掩护期再乘 1.8。
    // 用浮点累加、显示时才取整，避免高刷屏下某些帧四舍五入成 0 而看着卡住不动。
    const gain = 70 * dt * (isCoverActive ? 1.8 : 1);
    score += gain;
    greenFogMl = Math.min(GREEN_FOG_FULL_ML, greenFogMl + gain);
    fartVolume += gain;      // 单次放屁量：旁观奶蛙据此变脸

    if (isCoverActive || npcStunTimer > 0) {
      // 起风了 / 奶蛋被震晕：它什么都听不到，随便放，怀疑度还会回落
      suspicion = Math.max(0, suspicion - 16 * dt);
    } else {
      // 安静期：怀疑度上升
      suspicion += NPC_TUNING.suspicionRate * dt;
    }

    if (Date.now() - lastFartSoundTime > 230) {
      sounds.playFart(100 + Math.random() * 30, 0.22);
      lastFartSoundTime = Date.now();
    }
  } else {
    suspicion = Math.max(0, suspicion - 18 * dt);
  }

  // 4. 奶蛋 AI（灵敏度见 NPC_TUNING；被超级大屁震晕时整段跳过）
  if (npcStunTimer > 0) {
    npcStunTimer -= dt;
    npcState = NPC_STATES.STUNNED;
    suspicion = Math.max(0, suspicion - 26 * dt);
    if (npcStunTimer <= 0) {
      npcState = NPC_STATES.IDLE;
      nextNpcCheckTimer = NPC_TUNING.patrolMin;
    }
  } else if (isCoverActive) {
    // 起风了：风声盖过一切，奶蛋根本不会转头扫描察觉，老老实实背对着
    npcState = NPC_STATES.IDLE;
    npcStateTimer = 0;
    npcReactTimer = 0;
    nextNpcCheckTimer = Math.max(nextNpcCheckTimer, 1.6);
  } else {
    // 警觉值能提前推进巡逻，画面和五格始终指向同一阶段。
    const heard = Math.min(5, Math.ceil(suspicion / 20));
    if (heard >= 3 && npcState !== NPC_STATES.WATCHING) enterNpcWatching();
    else if (heard >= 2 && (npcState === NPC_STATES.IDLE || npcState === NPC_STATES.QUESTION)) enterNpcTurning();
    else if (heard >= 1 && npcState === NPC_STATES.IDLE) enterNpcQuestion();

    if (npcState === NPC_STATES.IDLE) {
      nextNpcCheckTimer -= dt;
      if (nextNpcCheckTimer <= 0) enterNpcQuestion();
    } else if (npcState === NPC_STATES.QUESTION) {
      npcStateTimer -= dt;
      if (npcStateTimer <= 0) enterNpcTurning();
    } else if (npcState === NPC_STATES.TURNING) {
      npcStateTimer -= dt;
      if (npcStateTimer <= 0) enterNpcWatching();
    } else if (npcState === NPC_STATES.WATCHING) {
      if (npcReactTimer > 0) npcReactTimer = Math.max(0, npcReactTimer - dt);
      if (isFarting && npcReactTimer <= 0) {
        gameOver('caught');
        return;
      }
      npcStateTimer -= dt;
      if (npcStateTimer <= 0) {
        npcState = NPC_STATES.IDLE;
        nextNpcCheckTimer = npcDuration(NPC_TUNING.patrolMin, NPC_TUNING.patrolMax);
      }
    }
  }

  // 5. Check Game Over（无倒计时：仅「爆炸社死」/「被抓现行」两种结局）
  if (gasLevel >= 100) {
    gameOver('exploded');
    return;
  }
  if (suspicion >= 100) {
    gameOver('caught');
    return;
  }

  // 5.5 超级大屁：每累计 MEGA_FART_STEP 毫升自动爆一发
  if (score >= nextMegaFartAt) {
    nextMegaFartAt += MEGA_FART_STEP;
    triggerMegaFart();
  }
  // 慢放：喷射持续 1.4 秒慢慢涌出，而不是一帧炸完。
  // 奶蛙已调头朝右，烟往奶蛋方向飞（dir = +1）。
  if (megaFartTimer > 0) {
    megaFartTimer -= dt;
    const mx = width * 0.32 + 64;
    const my = height * 0.72 - 58;
    for (let i = 0; i < 3; i++) {
      spawnGreenFart(mx + (Math.random() - 0.5) * 150,
                     my + (Math.random() - 0.5) * 150, 1);
    }
  }

  // 6. Bystander reaction tier（按「单次放屁量」升档，松手 1.5 秒后回到嫌弃）
  let bt = 0;
  for (let i = 0; i < BYSTANDER_TIERS.length; i++) {
    if (fartVolume >= BYSTANDER_TIERS[i].ml) bt = i;
  }
  if (isFarting) {
    bystanderHold = BYSTANDER_HOLD;
  } else if (bystanderHold > 0) {
    bystanderHold -= dt;
  } else {
    bt = 0;                       // 收工，回到嫌弃
    fartVolume = 0;
  }
  if (bt !== bystanderTier) {
    previousBystanderTier = bystanderTier;
    bystanderTier = bt;
    bystanderPop = 1.0;
    bystanderTransition = 0.15;
    pushBystanderLine(BYSTANDER_TIERS[bt].key);
    bystanderLineTimer = BYSTANDER_LINE_INTERVAL + Math.random() * 0.8;
  }
  if (bystanderPop > 0) bystanderPop = Math.max(0, bystanderPop - dt * 1.6);
  if (bystanderTransition > 0) bystanderTransition = Math.max(0, bystanderTransition - dt);

  // 同档位持续补字，让吐槽一条条累积着飘上去
  if (isFarting && bystanderHold > 0) {
    bystanderLineTimer -= dt;
    if (bystanderLineTimer <= 0) {
      bystanderLineTimer = BYSTANDER_LINE_INTERVAL + Math.random() * 0.8;
      pushBystanderLine(BYSTANDER_TIERS[bystanderTier].key);
    }
  }

  // 7. Update UI (Grids & Score)
  updateHUDGrids();
}

function updateHUDGrids() {
  // 1. Update Scoreboard
  scoreVal.textContent = String(Math.floor(score)).padStart(6, '0');
  if (isFarting && isCoverActive && comboCount >= 2) {
    scoreCombo.classList.add('show');
  } else {
    scoreCombo.classList.remove('show');
  }

  // 2. Update 5-Grid Gas Blocks (五格子带颜色)
  // Each block = 20%
  const activeGasBlocks = Math.min(5, Math.ceil(gasLevel / 20));
  const gasTiers = ['tier-1', 'tier-2', 'tier-3', 'tier-4', 'tier-5'];
  gasBlocks.forEach((block, idx) => {
    block.className = 'grid-block';
    if (idx < activeGasBlocks) {
      block.classList.add('active', gasTiers[idx]);
    }
  });
  // Gas badge label
  const gasPercent = Math.round(Math.min(100, gasLevel));
  if (gasPercent >= 100) {
    gasBadge.textContent = `💥 危急 100%`;
    gasBadge.style.background = '#fee2e2';
    gasBadge.style.color = '#ef4444';
  } else {
    gasBadge.textContent = `⚠️ ${gasPercent}%`;
    gasBadge.style.background = activeGasBlocks >= 4 ? '#ffedd5' : activeGasBlocks >= 3 ? '#fef3c7' : '#ecfdf5';
    gasBadge.style.color = activeGasBlocks >= 4 ? '#c2410c' : activeGasBlocks >= 3 ? '#b45309' : '#047857';
  }

  // 3. Update 5-Grid Suspicion Blocks + 警示察觉程度
  const activeSusBlocks = awarenessTier();
  susBlocks.forEach((block, idx) => {
    block.className = 'grid-block';
    if (idx < activeSusBlocks) {
      block.classList.add('active', gasTiers[idx]);
    }
  });

  // Awareness stages (警示察觉程度)
  if (npcStunTimer > 0 || npcState === NPC_STATES.STUNNED) {
    susBadge.textContent = '💫 晕乎乎';
    susBadge.style.background = '#ede9fe';
    susBadge.style.color = '#7c3aed';
  } else if (activeSusBlocks === 0) {
    susBadge.textContent = '😴 发呆中';
    susBadge.style.background = '#f1f5f9';
    susBadge.style.color = '#64748b';
  } else if (activeSusBlocks === 1) {
    susBadge.textContent = '❓';
    susBadge.style.background = '#fefce8';
    susBadge.style.color = '#ca8a04';
  } else if (activeSusBlocks === 2) {
    susBadge.textContent = '↶ 转身中';
    susBadge.style.background = '#fefce8';
    susBadge.style.color = '#84cc16';
  } else if (activeSusBlocks === 3) {
    susBadge.textContent = '🔎 扫描中';
    susBadge.style.background = '#fef3c7';
    susBadge.style.color = '#d97706';
  } else if (activeSusBlocks === 4) {
    susBadge.textContent = '🔴 警觉';
    susBadge.style.background = '#ffedd5';
    susBadge.style.color = '#ea580c';
  } else {
    susBadge.textContent = '⚠️ 极危！扫描中';
    susBadge.style.background = '#fee2e2';
    susBadge.style.color = '#dc2626';
  }

  // 4. Equalizer Waveform Bars (放大，其他文字全去)
  const now = Date.now();
  if (isCoverActive) {
    soundwaveBox.className = 'soundwave-box safe';
    waveBars.forEach((bar, idx) => {
      const wave = Math.sin(now * 0.016 + idx * 0.7);
      const wave2 = Math.cos(now * 0.024 + idx * 1.2);
      const h = 24 + (wave * 12) + (wave2 * 9);
      bar.style.height = `${Math.max(10, Math.min(46, h))}px`;
      bar.style.backgroundColor = '#10b981';
    });
  } else {
    soundwaveBox.className = 'soundwave-box danger';
    waveBars.forEach((bar, idx) => {
      const wave = Math.sin(now * 0.005 + idx * 0.5);
      const h = 6 + wave * 3;
      bar.style.height = `${Math.max(4, h)}px`;
      bar.style.backgroundColor = '#cbd5e1';
    });
  }
}

function drawScanBeam(fromX, fromY, targetX, targetY, tier) {
  const color = tier >= 5 ? '239,73,75' : tier === 4 ? '245,124,48' : '249,179,61';
  ctx.save();
  for (let layer = 10; layer >= 0; layer--) {
    const half = 12 + layer * 5.6;
    const alpha = layer === 0 ? 0.18 : 0.014;
    const gradient = ctx.createLinearGradient(fromX, fromY, targetX, targetY);
    gradient.addColorStop(0, `rgba(${color},0.04)`);
    gradient.addColorStop(0.3, `rgba(${color},${alpha})`);
    gradient.addColorStop(0.82, `rgba(${color},${alpha})`);
    gradient.addColorStop(1, `rgba(${color},0)`);
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.moveTo(fromX, fromY - 4);
    ctx.lineTo(targetX, targetY - half);
    ctx.quadraticCurveTo(targetX - 32, targetY, targetX, targetY + half);
    ctx.lineTo(fromX, fromY + 4);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawScanSpot(x, y, tier) {
  const color = tier >= 5 ? '239,73,75' : tier === 4 ? '245,124,48' : '249,179,61';
  ctx.save();
  const glow = ctx.createRadialGradient(x, y, 0, x, y, 53);
  glow.addColorStop(0, `rgba(${color},0.18)`);
  glow.addColorStop(1, `rgba(${color},0)`);
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(x, y, 53, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = `rgba(${color},0.43)`;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.ellipse(x, y, 25, 32, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, width, height);

  // 屏幕震动（超级大屁 / 爆炸社死）
  ctx.save();
  if (shakeTime > 0) {
    const k = Math.min(1, shakeTime / 0.55);
    ctx.translate((Math.random() - 0.5) * shakePower * k,
                  (Math.random() - 0.5) * shakePower * k);
  }

  // 极简风：不画任何场景，只在 pondY 留一条地平线，角色站在上面
  const pondY = height * 0.72;

  ctx.save();
  ctx.strokeStyle = "rgba(15, 23, 42, 0.10)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, pondY);
  ctx.lineTo(width, pondY);
  ctx.stroke();
  ctx.restore();


  // 奶蛋的视线从侧身图的眼睛出发，柔和地扫过奶蛙身体。
  let scanSpot = null;
  if (npcState === NPC_STATES.WATCHING) {
    const eggH = Math.min(232, Math.max(105, pondY - 12 - 70));
    const eggW = eggSide.naturalWidth && eggSide.naturalHeight
      ? eggH * eggSide.naturalWidth / eggSide.naturalHeight : 143;
    const eyeX = width * 0.76 - eggW * 0.2;
    const eyeY = pondY - 12 - eggH * 0.61;
    const frogX = width * 0.32 + 14;
    const frogHeight = Math.min(248, Math.max(95, (pondY - 14 - 70) / 1.1)) * visualGasScale;
    const frogY = pondY - 14 - frogHeight
      * (0.50 + Math.sin(Date.now() * 0.0025) * 0.14);
    drawScanBeam(eyeX, eyeY, frogX, frogY, awarenessTier());
    scanSpot = { x: frogX, y: frogY };
  }

  /* 统一角色绘制：按「目标高度 + 底边锚点」等比缩放。
     anchorX 是水平锚点（0=左缘对齐 cx，0.5=中心对齐，1=右缘对齐），
     精灵图换成任何尺寸都不会变形。 */
  const drawChar = (img, cx, baseY, targetH, anchorX, dx, dy) => {
    if (!img || !img.complete || !img.naturalWidth) return null;
    const w = targetH * (img.naturalWidth / img.naturalHeight);
    const x = cx - w * anchorX + (dx || 0);
    const y = baseY - targetH + (dy || 0);
    ctx.drawImage(img, x, y, w, targetH);
    return { x, y, w, h: targetH };
  };

  // 1. 左侧玩家奶蛙
  const playerX = width * 0.32;
  const playerY = pondY - 14;

  // 落地软影：不然室内地板上一站就像飘着
  ctx.save();
  ctx.fillStyle = "rgba(92, 64, 38, 0.20)";
  ctx.beginPath();
  ctx.ellipse(playerX, playerY - 3, 60, 11, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 超级大屁期间：整只水平镜像，屁股调头朝右，正对着奶蛋喷
  const megaBlast = megaFartTimer > 0;
  if (isFarting || megaBlast) {
    // 深蹲背身形态：本体偏在画面右侧、左侧是排气浓烟，故锚点右移
    const wx = (Math.random() - 0.5) * 3;
    const wy = (Math.random() - 0.5) * 2;
    ctx.save();
    if (megaBlast) {                 // 镜像后尾气跑到右边
      ctx.translate(playerX * 2, 0);
      ctx.scale(-1, 1);
    }
    const fartHeight = Math.min(238, Math.max(95, (playerY - 70) / 1.1)) * visualGasScale;
    const box = drawChar(spriteFart, playerX, playerY, fartHeight, 0.58, wx, wy);
    ctx.restore();
    if (box) {
      // 粒子直接生在「精灵图里已经画好的那团尾气」范围上，新烟与自带的尾气
      // 叠成一团持续翻滚的浓烟，而不是在屁股边上另起一坨分家的云。
      const dir = megaBlast ? 1 : -1;
      const sx = megaBlast ? (0.66 + Math.random() * 0.30)   // 镜像后尾气在右半边
                           : (0.03 + Math.random() * 0.27);
      const sy = 0.48 + Math.random() * 0.28;   // 尾气纵向范围
      const px = box.x + box.w * sx + wx;
      const py = box.y + box.h * sy + wy;
      spawnGreenFart(px, py, dir);
      spawnGreenFart(px, py, dir);
    }
  } else {
    let tremX = 0;
    if (gasLevel > 70) {
      tremX = Math.sin(Date.now() * 0.04) * ((gasLevel - 70) / 30 * 2.5);
      if (Math.random() < 0.16) spawnSweat(playerX - 20, playerY - 130);
    }
    // 胀气越高整体等比撑大（不再横向拉伸，避免把新素材拉变形）
    const skinImg = activeSkin ? SKIN_SPRITES[activeSkin] : null;
    const idleImg = (skinImg && skinImg.complete && skinImg.naturalWidth)
      ? skinImg : spriteIdle;
    const idleHeight = Math.min(248, Math.max(95, (playerY - 70) / 1.1)) * visualGasScale;
    drawChar(idleImg, playerX, playerY, idleHeight, 0.5, tremX, 0);
  }
  if (scanSpot) drawScanSpot(scanSpot.x, scanSpot.y, awarenessTier());

  // 2. 右侧监视者奶蛋：三态对应三视图（背对 → 猛地转正 → 侧身锁定玩家）
  const npcX = width * 0.76;
  const npcY = pondY - 12;
  const npcHeight = Math.min(232, Math.max(105, npcY - 70));

  ctx.save();
  ctx.fillStyle = "rgba(92, 64, 38, 0.20)";
  ctx.beginPath();
  ctx.ellipse(npcX, npcY - 3, 56, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  const npcImg = npcState === NPC_STATES.WATCHING ? eggSide
               : npcState === NPC_STATES.TURNING ? eggFront
               : eggBack;                                        // 背对：压根没在看你
  let npcBox;
  if (npcState === NPC_STATES.STUNNED) {
    // 被超级大屁震晕：原地晃悠
    ctx.save();
    ctx.translate(npcX, npcY);
    ctx.rotate(Math.sin(Date.now() * 0.017) * 0.14);
    ctx.translate(-npcX, -npcY);
    npcBox = drawChar(eggBack, npcX, npcY, npcHeight, 0.5, 0, 0);
    ctx.restore();
  } else {
    npcBox = drawChar(npcImg, npcX, npcY, npcHeight, 0.5, 0, 0);
  }

  // 头顶提示符号：直接显示 emoji（不加边框），水平居中于奶蛋头顶。
  // 竖直方向夹在 SCOREBOARD_SAFE_Y 以下，避免和顶部的「排气量」得分板叠在一起。
  const npcTop = npcBox ? npcBox.y : npcY - npcHeight;
  const GLYPH_HALF = 38;
  const SCOREBOARD_SAFE_Y = 108;  // 得分板下沿 + 余量（canvas 坐标）
  if (npcState === NPC_STATES.QUESTION || npcState === NPC_STATES.WATCHING) {
    const isCatch = npcState === NPC_STATES.WATCHING;
    const bob = Math.sin(Date.now() * 0.006) * 5;
    const gy = Math.max(npcTop - GLYPH_HALF + bob, SCOREBOARD_SAFE_Y);
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "66px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
    // 注：❓❗ 在 macOS 上走 Apple Color Emoji 彩色字形，fillStyle 不生效、
    // 两者本来都是红色，靠光晕颜色 + 字形区分。若要「琥珀色问号 / 红色叹号」
    // 的强对比，把下面的字形换成 ASCII 的 "?" / "!" 并设 fillStyle 即可。
    ctx.shadowColor = isCatch ? "rgba(239,68,68,0.85)" : "rgba(234,179,8,0.85)";
    ctx.shadowBlur = isCatch ? 18 : 12;
    ctx.fillText(isCatch ? "❗" : "❓", npcX, gy);
    ctx.restore();
  }

  // 被震晕：头顶转圈的星星
  if (npcState === NPC_STATES.STUNNED) {
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "26px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
    const t = Date.now() * 0.0042;
    const oy = Math.max(npcTop - 26, SCOREBOARD_SAFE_Y);
    for (let i = 0; i < 3; i++) {
      const a = t + i * (Math.PI * 2 / 3);
      ctx.fillText("💫", npcX + Math.cos(a) * 36, oy + Math.sin(a) * 9);
    }
    ctx.restore();
  }

  // 3. Draw Bystander Milk Frog (旁观奶蛙，站在画面前景中下方)
  {
    const drawBystander = (tierIndex, opacity) => {
      const tier = BYSTANDER_TIERS[tierIndex];
      const img = bystanderSprites[tier.key];
      if (!img || !img.complete || !img.naturalWidth || opacity <= 0) return;
      const ratio = img.naturalWidth / img.naturalHeight;
      const pop = bystanderPop > 0 ? 1 + Math.sin(bystanderPop * Math.PI) * 0.10 : 1;
      const rage = fartVolume >= BYSTANDER_RAGE_ML;
      const bh = Math.min(150, height * 0.34) * pop * (rage ? 1.20 : 1);
      const bw = bh * ratio;
      const phase = Date.now() * 0.006;
      const lean = tierIndex === 0 ? -0.025 : tierIndex === 2 ? -0.045
                 : tierIndex === 3 ? Math.sin(phase * 3) * 0.025 : 0;
      const nod = tierIndex === 1 ? Math.abs(Math.sin(phase * 1.3)) * 5 : 0;
      const hop = tierIndex === 2 ? Math.sin(phase) * 4
                : tierIndex === 3 ? Math.abs(Math.sin(phase * 2)) * 5 : 0;
      const bx = width * 0.47 + (tierIndex === 0 ? 3 : tierIndex === 2 ? -4 : 0)
               + (rage ? (Math.random() - 0.5) * 7 : 0);
      const baseY = height * 0.99;
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.translate(bx, baseY - nod - hop);
      ctx.rotate(lean);
      ctx.drawImage(img, -bw / 2, -bh, bw, bh);
      ctx.restore();
    };
    const oldOpacity = Math.min(1, bystanderTransition / 0.15);
    if (oldOpacity > 0) drawBystander(previousBystanderTier, oldOpacity);
    drawBystander(bystanderTier, 1 - oldOpacity);
  }

  // 4. Green Fart Smoke and Sweat
  updateAndDrawParticles();

  // 5. 旁观奶蛙的累积吐槽（一条条往上飘）
  for (const bt2 of bystanderTexts) {
    ctx.save();
    const progress = Math.min(1, bt2.age / BYSTANDER_LINE_LIFE);
    ctx.globalAlpha = Math.max(0, Math.min(1, bt2.age / 0.18,
      (BYSTANDER_LINE_LIFE - bt2.age) / 0.65));
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "900 18px 'Lantinghei SC','PingFang SC','Microsoft YaHei',sans-serif";
    ctx.lineWidth = 5.5;
    ctx.strokeStyle = "rgba(255, 255, 255, 0.95)";
    const tx = bt2.x + bt2.drift * progress;
    const ty = bt2.y - 65 * (1 - (1 - progress) * (1 - progress));
    ctx.strokeText(bt2.text, tx, ty);
    ctx.fillStyle = "#0f172a";
    ctx.fillText(bt2.text, tx, ty);
    ctx.restore();
  }

  // 6. 超级大屁横幅：先正常显示，退场时一边放大一边变淡
  if (megaBanner > 0) {
    const FADE = 1.0;                                   // 退场时长
    const k = megaBanner > FADE ? 1 : Math.max(0, megaBanner / FADE);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.translate(width * 0.5, height * 0.28);
    ctx.scale(1 + (1 - k) * 0.9, 1 + (1 - k) * 0.9);    // 放大到 1.9 倍
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "900 34px 'Lantinghei SC','PingFang SC','Microsoft YaHei',sans-serif";
    ctx.lineWidth = 7;
    ctx.strokeStyle = "rgba(15, 23, 42, 0.9)";
    ctx.strokeText("💨 超级大屁！", 0, 0);
    ctx.fillStyle = "#86efac";
    ctx.fillText("💨 超级大屁！", 0, 0);
    ctx.restore();
  }

  // 7. 绿色残留雾：大小和浓淡不一的烟团，风吹过后会疏开。
  const fog = Math.min(1, greenFogMl / GREEN_FOG_FULL_ML);
  if (fog > 0.002) {
    ctx.save();
    ctx.fillStyle = `rgba(83, 172, 74, ${fog * fog * 0.04})`;
    ctx.fillRect(0, 0, width, height);
    const ft = Date.now() * 0.00023;
    const colors = ['104,187,54', '51,171,80', '164,209,58', '35,139,84'];
    for (let i = 0; i < 13; i++) {
      const fx = width * (0.11 + ((i * 37) % 79) / 100)
               + Math.sin(ft + i * 0.9) * 12 + (isCoverActive ? width * 0.12 : 0);
      const fy = height * (0.19 + ((i * 23) % 76) / 100)
               + Math.cos(ft * 1.2 + i) * 9;
      const radius = Math.min(width, height) * (0.23 + (i % 4) * 0.055);
      const color = colors[i % colors.length];
      const alpha = fog * (0.37 + (i % 3) * 0.055);
      const rg = ctx.createRadialGradient(fx, fy, 0, fx, fy, radius);
      rg.addColorStop(0, `rgba(${color},${alpha})`);
      rg.addColorStop(0.46, `rgba(${color},${alpha * 0.47})`);
      rg.addColorStop(1, `rgba(${color},0)`);
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(fx, fy, radius, 0, Math.PI * 2);
      ctx.fill();
    }
    // 4000 ml 才到完全遮蔽极限；此前始终有浓淡层次。
    ctx.fillStyle = `rgba(52, 132, 63, ${Math.pow(fog, 72)})`;
    ctx.fillRect(0, 0, width, height);
    ctx.restore();
  }

  ctx.restore();   // 结束屏幕震动位移
}

function gameLoop(currentTime) {
  const dt = Math.min(0.1, (currentTime - lastFrameTime) / 1000);
  lastFrameTime = currentTime;

  update(dt);
  render();

  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

/* 玩家人次：进页面只 POST 一次；失败后仅 GET 读取，避免重试造成重复计数。 */
(function initPlayCount() {
  const num = document.getElementById('play-count-num');
  if (!num) return;
  const readTotal = (response) => {
    if (!response.ok) throw new Error(`count status ${response.status}`);
    return response.json();
  };
  const showTotal = (data) => {
    if (!data || !Number.isSafeInteger(data.total) || data.total < 0) throw new Error('invalid count');
    num.textContent = String(data.total).padStart(4, '0');
  };
  fetch('/api/plays', { method: 'POST', cache: 'no-store' })
    .then(readTotal).then(showTotal)
    .catch(() => {
      num.textContent = '暂时无法读取';
      setTimeout(() => {
        fetch('/api/plays', { method: 'GET', cache: 'no-store' })
          .then(readTotal).then(showTotal)
          .catch(() => { num.textContent = '暂时无法读取'; });
      }, 2000);
    });
})();

/* ==========================================================================
   End Game
   ========================================================================== */
function gameOver(reason) {
  isPlaying = false;
  isFarting = false;
  fartBtn.classList.remove('active');

  const finalScore = Math.floor(score);
  const previousBest = bestScore;
  if (finalScore > bestScore) {
    bestScore = finalScore;
    saveValue('naiwa.bestScore', bestScore);
  }
  const newlyUnlocked = ROLE_DEFS.filter((role) => role.need > previousBest && role.need <= bestScore);
  document.getElementById('unlock-notice').textContent = newlyUnlocked.length
    ? `新角色解锁：${newlyUnlocked.map((role) => role.name).join('、')}！` : '';
  submitLeaderboard(finalScore);

  const title = fartTitle(finalScore);
  if (title) {
    modalRank.textContent = title;
    modalRank.style.display = 'inline-block';
  } else {
    modalRank.style.display = 'none';
  }
  statTime.textContent = `${fartSeconds.toFixed(1)}s`;
  statScore.innerHTML = `${finalScore.toLocaleString()}<em>ml</em>`;
  // 结算立绘跟着结局走：炸了就用放屁形态，被抓就保持静态
  modalFrog.src = reason === 'exploded' ? spriteFart.src : spriteIdle.src;

  if (reason === 'exploded') {
    sounds.playExplode();
    // 憋不住的终局：先把这一下炸给玩家看，再弹结算面板
    shakeTime = 0.9;
    shakePower = 24;
    const bx = width * 0.32;
    const by = height * 0.72 - 70;
    for (let i = 0; i < 90; i++) {
      spawnGreenFart(bx + (Math.random() - 0.5) * 240,
                     by + (Math.random() - 0.5) * 210);
    }
    modalTitle.textContent = "惊天巨响！当场社死！";
    setTimeout(() => { endModal.style.display = 'flex'; }, 850);
    return;
  }

  sounds.playCaught();
  modalTitle.textContent = "被奶蛋抓个正着！";

  endModal.style.display = 'flex';
}

restartBtn.addEventListener('click', () => {
  endModal.style.display = 'none';
  isPlaying = true;

  gasLevel = 25;
